name: Decode portfolio sprite

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Diagnose sprite fragments
        run: |
          node <<'NODE'
          const fs = require('fs');
          const files = fs.readdirSync('.').filter(f => /^sprite-.*\.js$/.test(f)).sort();
          const fragments = [];
          for (const file of files) {
            const text = fs.readFileSync(file, 'utf8');
            const matches = [...text.matchAll(/\+\s*"([^"]*)"\s*;?/gs)];
            matches.forEach((m, index) => {
              const s = m[1];
              const decoded = Buffer.from(s, 'base64');
              fragments.push({
                file,
                index,
                chars: s.length,
                mod4: s.length % 4,
                equals: (s.match(/=/g) || []).length,
                start: s.slice(0, 24),
                end: s.slice(-24),
                decodedBytes: decoded.length,
                decodedMagicHex: decoded.subarray(0, 16).toString('hex'),
                decodedMagicAscii: decoded.subarray(0, 16).toString('ascii').replace(/[^\x20-\x7e]/g,'.'),
                riffDeclaredBytes: decoded.length >= 12 && decoded.toString('ascii',0,4) === 'RIFF' ? decoded.readUInt32LE(4) + 8 : null,
                webpMagic: decoded.length >= 12 && decoded.toString('ascii',0,4) === 'RIFF' && decoded.toString('ascii',8,12) === 'WEBP'
              });
            });
          }
          const textJoin = fragments.map(f => {
            const text = fs.readFileSync(f.file,'utf8');
            return [...text.matchAll(/\+\s*"([^"]*)"\s*;?/gs)][f.index][1];
          }).join('');
          const pieceBuffers = fragments.map(f => {
            const text = fs.readFileSync(f.file,'utf8');
            const s = [...text.matchAll(/\+\s*"([^"]*)"\s*;?/gs)][f.index][1];
            return Buffer.from(s,'base64');
          });
          const candidates = {
            decodeJoinedText: Buffer.from(textJoin,'base64'),
            concatDecodedPieces: Buffer.concat(pieceBuffers)
          };
          const describe = buffer => {
            const riffPositions=[];
            for(let i=0;i<=buffer.length-12;i++){
              if(buffer.toString('ascii',i,i+4)==='RIFF' && buffer.toString('ascii',i+8,i+12)==='WEBP'){
                riffPositions.push({offset:i,declaredBytes:buffer.readUInt32LE(i+4)+8,complete:i+buffer.readUInt32LE(i+4)+8<=buffer.length});
              }
            }
            return {bytes:buffer.length,magicHex:buffer.subarray(0,24).toString('hex'),magicAscii:buffer.subarray(0,24).toString('ascii').replace(/[^\x20-\x7e]/g,'.'),riffPositions};
          };
          const diagnostics={files,fragmentCount:fragments.length,fragments,candidates:Object.fromEntries(Object.entries(candidates).map(([k,v])=>[k,describe(v)]))};
          fs.mkdirSync('assets',{recursive:true});
          fs.writeFileSync('assets/portfolio-diagnostics.json',JSON.stringify(diagnostics,null,2));
          console.log(JSON.stringify(diagnostics,null,2));
          NODE
      - name: Commit diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/portfolio-diagnostics.json
          git commit -m "Add portfolio sprite diagnostics" || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
