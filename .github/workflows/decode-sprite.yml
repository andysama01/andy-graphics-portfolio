name: Recover portfolio assets

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Extract embedded asset packs
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const candidates = fs.readdirSync('.').filter(f => /^(assetpack|embedded).*\.js$/.test(f)).sort();
          const diagnostics = [];
          const recovered = new Map();
          for (const file of candidates) {
            const context = {window:{}};
            vm.createContext(context);
            try {
              vm.runInContext(fs.readFileSync(file,'utf8'),context,{timeout:30000,filename:file});
              const assets = context.window.EMBEDDED_ASSETS || {};
              const keys = Object.keys(assets);
              diagnostics.push({file,ok:true,keyCount:keys.length,keys:keys.map(k=>({key:k,chars:String(assets[k]).length,start:String(assets[k]).slice(0,40)}))});
              for (const [key,value] of Object.entries(assets)) recovered.set(key,String(value));
            } catch (error) {
              diagnostics.push({file,ok:false,error:String(error)});
            }
          }
          fs.mkdirSync('assets/recovered',{recursive:true});
          const manifest=[];
          for (const [key,value] of recovered) {
            const match=value.match(/^data:([^;]+);base64,(.+)$/s);
            if(!match){manifest.push({key,ok:false,reason:'not-base64-data-uri'});continue;}
            const mime=match[1];
            const ext=mime.includes('webp')?'webp':mime.includes('png')?'png':mime.includes('jpeg')?'jpg':'bin';
            const safe=key.replace(/^assets\/(flyers|logos)\//,'').replace(/\.svg$/i,'').replace(/[^a-zA-Z0-9._-]+/g,'-');
            const filename=`${safe}.${ext}`;
            const data=Buffer.from(match[2],'base64');
            fs.writeFileSync(`assets/recovered/${filename}`,data);
            manifest.push({key,filename,mime,bytes:data.length,ok:true});
          }
          fs.writeFileSync('assets/recovered-manifest.json',JSON.stringify({candidates,diagnostics,assetCount:recovered.size,manifest},null,2));
          console.log(JSON.stringify({candidates,diagnostics,assetCount:recovered.size,manifest},null,2));
          NODE
      - name: Validate and build contact sheet
        run: |
          python -m pip install --quiet pillow
          python <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          import glob,json,os,math
          meta=json.load(open('assets/recovered-manifest.json'))
          cards=[]; valid=[]
          for item in meta['manifest']:
              if not item.get('ok'): continue
              p='assets/recovered/'+item['filename']
              try:
                  im=Image.open(p).convert('RGB')
                  item.update({'valid':True,'width':im.width,'height':im.height})
                  thumb=ImageOps.contain(im,(250,210))
                  card=Image.new('RGB',(270,250),'white')
                  card.paste(thumb,((270-thumb.width)//2,8))
                  ImageDraw.Draw(card).text((8,226),item['filename'][:38],fill='black')
                  cards.append(card); valid.append(item)
              except Exception as e:
                  item.update({'valid':False,'validationError':str(e)})
          if cards:
              cols=4; rows=math.ceil(len(cards)/cols)
              sheet=Image.new('RGB',(cols*270,rows*250),(225,225,225))
              for i,card in enumerate(cards):sheet.paste(card,((i%cols)*270,(i//cols)*250))
              sheet.save('assets/recovered-contact-sheet.jpg',quality=86)
          meta['validCount']=len(valid)
          open('assets/recovered-manifest.json','w').write(json.dumps(meta,indent=2))
          PY
      - name: Commit recovered assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/recovered assets/recovered-manifest.json assets/recovered-contact-sheet.jpg || true
          git commit -m "Recover embedded portfolio gallery assets" || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
